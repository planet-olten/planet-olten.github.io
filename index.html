<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Planet Olten – neue Adresse</title>
<meta http-equiv="refresh" content="3; url=https://planet-olten.planet-olten.workers.dev/">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#000C47;color:#fff;font-family:system-ui,-apple-system,sans-serif}
main{max-width:420px;padding:32px;text-align:center}
p{color:#D6D9EA;line-height:1.5}
a{display:inline-block;margin-top:12px;padding:12px 20px;border-radius:6px;background:#ED5837;color:#fff;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<main>
<h1>Planet Olten ist umgezogen</h1>
<p>Die Vereins-App hat eine neue Adresse. Du wirst gleich weitergeleitet. Bitte Lesezeichen und App auf dem Handy oder im Dock neu hinzufügen.</p>
<a id="go" href="https://planet-olten.planet-olten.workers.dev/">Zur neuen Adresse</a>
</main>
<script>
(async function () {
  var target = 'https://planet-olten.planet-olten.workers.dev/' + location.hash;
  document.getElementById('go').href = target;
  try { var regs = await navigator.serviceWorker.getRegistrations(); for (var r of regs) await r.unregister(); } catch (e) {}
  try { for (var k of await caches.keys()) await caches.delete(k); } catch (e) {}
  location.replace(target);
})();
</script>
</body>
</html>
